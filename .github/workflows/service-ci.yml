name: Service verification
on:
  push:
    paths: ["service/**", ".github/workflows/service-ci.yml"]
  pull_request:
    paths: ["service/**", ".github/workflows/service-ci.yml"]
  schedule:
    # Nightly native React/Vite acceptance (03:17 KST).
    - cron: "17 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # The nightly schedule runs only the native acceptance job below; workflow_dispatch runs both.
    if: github.event_name != 'schedule'
    name: verify (${{ matrix.os }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: default
          # The owner's profile: TEMP, TMP, LOCALAPPDATA and the browser path contain Korean
          # characters. Expected to fail until T01 (OPS-1, lease protocol v2) lands.
          - os: windows-latest
            variant: non-ascii-paths
          # Informational until P7: a failure here does not fail the workflow.
          - os: ubuntu-latest
            variant: default
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: service
        shell: bash
    steps:
      # Full history: root tests read pinned historical blobs with `git show`.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: awdr74100/figwright
          ref: a835e81b575eab2c9265a67f9353c89b848f81ca
          path: code-kb/figwright
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alvinindra/figma-mcp-rust
          ref: 6094566436577b29d04393c774d51492c12671e1
          path: code-kb/figma-mcp-rust
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: denysosadchyi/figmosha2
          ref: 547cefb4c90abaa1da68db5455b921cbf3f8a5b9
          path: code-kb/figmosha2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: service/.node-version
      # Decision D4: Playwright's Firefox lives in a fixed PLAYWRIGHT_BROWSERS_PATH.
      - name: Fix the Playwright browser location
        if: matrix.variant != 'non-ascii-paths'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"
      - name: Use Korean-character TEMP, TMP, LOCALAPPDATA and browser paths
        if: matrix.variant == 'non-ascii-paths'
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP '사용자-한글경로'
          $temp = Join-Path $base 'Temp'
          $localAppData = Join-Path $base 'AppData\Local'
          $browsers = Join-Path $localAppData 'ms-playwright'
          New-Item -ItemType Directory -Force -Path $temp, $localAppData, $browsers | Out-Null
          @(
            "TEMP=$temp",
            "TMP=$temp",
            "LOCALAPPDATA=$localAppData",
            "PLAYWRIGHT_BROWSERS_PATH=$browsers"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: corepack enable
      - id: install
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Firefox with system dependencies
        if: runner.os == 'Linux'
        run: corepack pnpm --filter @sfp/cli exec playwright install --with-deps firefox
      - name: Install Playwright Firefox
        if: runner.os == 'Windows'
        run: corepack pnpm --filter @sfp/cli exec playwright install firefox
      # Every gate below runs even when an earlier gate failed, so that each one reports.
      - name: Provenance lock (offline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify-upstream-lock.mjs --offline
      - name: Provenance lock (with upstreams)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify-upstream-lock.mjs --with-upstreams ../code-kb
      - name: Typecheck (packages, scripts and root tests)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm format:check
      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm knip
      # Generated tool-contract artifacts (union manifest, plugin contract, README counts) must be
      # current: the check regenerates in memory and fails on any difference.
      - name: Tool-contract drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm contracts:update --check
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm build
      # The run may fail only on tests named in test/known-failures.json; the ledger step below
      # decides and also fails on unledgered, stale or differently failing tests.
      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SFP_VITEST_JSON_REPORT: ${{ runner.temp }}/vitest-report.json
        run: |
          set -o pipefail
          corepack pnpm test 2>&1 | tee "${RUNNER_TEMP}/vitest.log"
      - name: Known-failure ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-test-report.mjs "${{ runner.temp }}/vitest-report.json" --log "${{ runner.temp }}/vitest.log"
      # Lists every skipped test and fails when a required suite (for example Firefox) skipped.
      - name: Test skip census
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/test-skip-census.mjs "${RUNNER_TEMP}/vitest-report.json"
      - name: Graph memory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify-graph-memory.mjs
      - name: SBOM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/generate-sbom.mjs
      - name: Third-party notices
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/generate-notices.mjs
      - name: Package artifacts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/package-artifacts.mjs
      - name: Checksums
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/generate-checksums.mjs
      - name: Artifact contents
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: corepack pnpm test:artifacts
      - name: Isolated packed runtime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/smoke-packed-mcp.mjs

  native-vite-acceptance:
    # Provisions the locked React/Vite preset from the npm registry through the native runner.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: service
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: service/.node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Native artifact suite with the React/Vite acceptance enabled
        env:
          SFP_NATIVE_VITE_ACCEPTANCE: "1"
          SFP_VITEST_JSON_REPORT: ${{ runner.temp }}/native-vite-report.json
        run: corepack pnpm exec vitest run packages/mcp/test/portal/native-artifacts.test.ts
      - name: Every acceptance test ran
        if: ${{ !cancelled() }}
        run: node scripts/test-skip-census.mjs "${RUNNER_TEMP}/native-vite-report.json" --forbid-skips
