<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>Super Figma Pipeline · 워크플로</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">워크플로로 이동</a>
    <div id="app">
      <main class="startup" aria-live="polite">
        <div class="brand-mark">S</div>
        <h1>Super Figma Pipeline</h1>
        <p>로컬 서비스에 연결하고 있습니다…</p>
        <button data-action="usage-guide">사용 가이드</button>
      </main>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="action-dialog"></dialog>
    <dialog id="usage-guide-dialog" aria-labelledby="usage-guide-title"></dialog>
    <dialog id="setup-dialog" aria-labelledby="setup-title"></dialog>
    <dialog id="workspace-dialog" aria-labelledby="workspace-title"></dialog>
    <dialog id="decision-dialog" aria-labelledby="decision-title"></dialog>
    <noscript>이 워크플로 포털을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
  </body>
</html>
